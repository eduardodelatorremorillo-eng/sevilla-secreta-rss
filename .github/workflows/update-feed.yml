name: Update Sevilla Escapadas RSS
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install beautifulsoup4
      - run: python generate_feed.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Escapadas RSS feed"
          file_pattern: docs/escapadas.xml
